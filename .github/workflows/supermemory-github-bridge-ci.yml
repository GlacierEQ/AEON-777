name: supermemory-github-bridge-ci

on:
  pull_request:
    paths:
      - "services/supermemory-github-bridge/**"
      - ".github/workflows/supermemory-github-bridge-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/supermemory-github-bridge/**"
      - ".github/workflows/supermemory-github-bridge-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/supermemory-github-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/supermemory-github-bridge/package-lock.json
      - run: npm ci
      - run: npm run verify
