name: AEON-777 CASEBRAIN Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casebrain-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  casebrain-validation:
    name: CASEBRAIN schema, semantic, and negative-control validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BRAIN/CONNECTORS/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate actor registry
        working-directory: BRAIN/ACTORS
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Validate connector fabric
        working-directory: BRAIN/CONNECTORS
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      - name: Compile provenance receipt schema
        working-directory: BRAIN/CONNECTORS
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import Ajv2020 from "ajv/dist/2020.js";
          import addFormats from "ajv-formats";

          const ajv = new Ajv2020({ allErrors: true, strict: true });
          addFormats(ajv);
          const schema = JSON.parse(fs.readFileSync("PROVENANCE_RECEIPT_SCHEMA.json", "utf8"));
          ajv.compile(schema);
          console.log("PASS: provenance receipt schema compiles under Draft 2020-12 strict mode");
          NODE

      - name: Create immutable validation receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-receipt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "artifact_sha256:"
            sha256sum \
              BRAIN/ACTORS/ACTOR_REGISTRY.json \
              BRAIN/ACTORS/ACTOR_REGISTRY_SCHEMA.json \
              BRAIN/ACTORS/ACTOR_FILE_LINK_MATRIX.csv \
              BRAIN/CONNECTORS/CONNECTOR_FABRIC.json \
              BRAIN/CONNECTORS/CONNECTOR_FABRIC_SCHEMA.json \
              BRAIN/CONNECTORS/PROVENANCE_RECEIPT_SCHEMA.json \
              BRAIN/CONNECTORS/MEMORY_TAXONOMY_AND_GOVERNANCE.md
          } | tee validation-receipt/CASEBRAIN_VALIDATION_RECEIPT.txt

      - name: Upload validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: casebrain-validation-receipt-${{ github.sha }}
          path: validation-receipt/CASEBRAIN_VALIDATION_RECEIPT.txt
          if-no-files-found: error
          retention-days: 90
