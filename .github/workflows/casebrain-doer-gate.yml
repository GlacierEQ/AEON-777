name: Casebrain Doer Gate

on:
  pull_request:
    paths:
      - 'shared/casebrain/runtime/**'
      - '.github/workflows/casebrain-doer-gate.yml'
  push:
    branches: [main]
    paths:
      - 'shared/casebrain/runtime/**'

permissions:
  contents: read

jobs:
  verify-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject unsupported completion claims
        run: node shared/casebrain/runtime/verify-completion.mjs
