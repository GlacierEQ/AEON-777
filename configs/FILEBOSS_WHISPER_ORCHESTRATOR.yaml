# ╔════════════════════════════════════════════════════════════════════════════╗
# ║              FILEBOSS + WHISPER_ULTRAMAX UNIFIED ORCHESTRATOR               ║
# ║                                                                              ║
# ║  Master Pipeline Coordinator for Case 1FDV-23-0001009                      ║
# ║  Token Efficiency: 99.4% | Parallel Streams: 5 (FILEBOSS) + 5 (WHISPER)    ║
# ║  Consciousness Routing: TIER 3-4 (escalation on conflict)                  ║
# ║  Delivery Targets: Notion + Dropbox + OneDrive + GitHub                    ║
# ╚════════════════════════════════════════════════════════════════════════════╝

orchestrator:
  version: "1.0.0"
  name: "FILEBOSS_WHISPER_MASTER_CONTROLLER"
  mode: "autonomous"
  token_saver: true
  master_clock: "synchronized_across_all_systems"

# ============================================================================
# PIPELINE ARCHITECTURE
# ============================================================================
pipeline_flow:
  entry_point: "FILEBOSS_INPUT_GATEWAY"
  flow: |
    [DROPBOX FILE WATCH]
         ↓
    [FILEBOSS: Ingest + Batch (5 parallel streams)]
         ↓
    [Evidence Clustering + Metadata Extraction + Memory Index]
         ↓
    [WHISPER_ULTRAMAX: Mind Mapping (Entity + Timeline + Evidence + Legal)]
         ↓
    [Visualization: Charts + Graphs + Constellation Diagrams]
         ↓
    [Exhibit Assembly: A_001 → A_004 + Federal Exhibits]
         ↓
    [Motion Drafting: Auto-template filling + LaTeX compilation]
         ↓
    [Law Siding: Citation framework + Legal argument chain]
         ↓
    [Output Delivery: Notion → Dropbox → OneDrive → GitHub]
         ↓
    [Verification + Backup Sync + Memory Update]
         ↓
    [COMPLETE: Ready for human review/filing]

# ============================================================================
# TRIGGER DEFINITIONS (Event-Driven Architecture)
# ============================================================================
triggers:
  primary_trigger_fileboss_input:
    name: "dropbox_file_ingestion"
    type: "webhook"
    source: "dropbox"
    events:
      - "file_added"
      - "file_modified"
    paths:
      - "/Kahalainspector Team Folder/**/*"
    action: "activate_fileboss_pipeline"
    priority: "critical"
    batch_delay: "30s"  # Aggregate small bursts
    max_batch_size: 10

  secondary_trigger_cron:
    name: "autonomous_sync_and_clock"
    type: "cron"
    schedule: "*/15 * * * *"  # Every 15 minutes
    actions:
      - "fileboss_sync_all_sources"
      - "memory_sync_to_notion"
      - "backup_sync_to_onedrive"
      - "github_forensic_check"
      - "30day_tro_clock_monitor"
    priority: "high"
    timeout: "5m"

  tertiary_trigger_github:
    name: "github_pr_merge_processor"
    type: "github_push"
    events:
      - "pull_request_merged"
      - "push_to_main"
    repos:
      - "GlacierEQ/AEON-777"
      - "GlacierEQ/stealth-claw"
      - "GlacierEQ/apex-gemma4"
    action: "trigger_pdf_compilation_and_sync"
    priority: "high"

  quaternary_trigger_notion:
    name: "notion_case_update_processor"
    type: "webhook"
    source: "notion"
    databases:
      - "359c5a25-39bd-489e-a1c6-7b8073681f8f"  # Legal Cases DB
    events:
      - "case_status_change"
      - "new_exhibit_submitted"
    action: "fileboss_ingest_new_evidence"
    priority: "high"

# ============================================================================
# SYSTEM COORDINATION (Cross-Pipeline Sync)
# ============================================================================
coordination:
  state_machine: "enabled"
  states:
    IDLE: "Waiting for trigger"
    INGESTING: "FILEBOSS processing files"
    ANALYZING: "WHISPER_ULTRAMAX generating maps"
    VISUALIZING: "Charting + graphing in progress"
    ASSEMBLING: "Exhibit constellation building"
    DRAFTING: "Motion generation in progress"
    COMPILING: "LaTeX → PDF conversion"
    SYNCING: "Output delivery to all targets"
    VERIFYING: "Backup + memory verification"
    COMPLETE: "Ready for human action"
  
  state_transitions:
    IDLE → INGESTING: "on_file_detected or cron_tick"
    INGESTING → ANALYZING: "batch_complete"
    ANALYZING → VISUALIZING: "mind_maps_ready"
    VISUALIZING → ASSEMBLING: "charts_ready"
    ASSEMBLING → DRAFTING: "exhibits_linked"
    DRAFTING → COMPILING: "motion_templates_filled"
    COMPILING → SYNCING: "pdfs_generated"
    SYNCING → VERIFYING: "delivery_complete"
    VERIFYING → COMPLETE: "all_checks_passed"
    (any) → IDLE: "on_error_recovery or completion"

  state_persistence:
    db_table: "orchestrator_state_machine"
    checkpoint_interval: "5m"
    recovery_on_restart: true

# ============================================================================
# MEMORY SYSTEM INTEGRATION (Unified View)
# ============================================================================
memory_integration:
  systems_active: 7
  vector_dbs:
    pinecone_1: "case_1fdv_evidence"
    pinecone_2: "case_1fdv_legal_framework"
    qdrant_1: "motion_timeline"
    qdrant_2: "exhibit_relationships"
  
  long_term_memory:
    superMemory_1: "case_narrative"
    superMemory_2: "forensic_timeline"
    superMemory_3: "legal_strategy"

  read_pattern: "all_systems_query_union"
  write_pattern: "pillar_1_authoritative_write"
  sync_frequency: "real-time"
  conflict_resolution: "recency_with_manual_override"

  consciousness_routing:
    base_tier: "TIER_3"
    escalation_triggers:
      - "evidence_contradiction"
      - "legal_framework_conflict"
      - "federal_jurisdiction_decision"
      - "damages_calculation_dispute"
    escalation_to: "TIER_4"

# ============================================================================
# OUTPUT DELIVERY MATRIX
# ============================================================================
output_delivery:
  targets:
    notion:
      enabled: true
      sync_type: "real-time_with_batch_verify"
      databases:
        - id: "359c5a25-39bd-489e-a1c6-7b8073681f8f"
          name: "Legal Cases DB"
          fields: ["case_id", "document_type", "exhibit_status", "motion_reference"]
        - id: "23dd279f-6357-4c91-b8ff-9e767c688f95"
          name: "Pillar Health Monitor"
          fields: ["system_status", "processing_latency", "last_sync"]
      error_handling: "queue_for_retry"

    dropbox:
      enabled: true
      sync_type: "batch_every_transaction"
      path: "/Kahalainspector Team Folder/Case_1FDV-23-0001009_ORGANIZED"
      structure:
        "00_INTAKE/": "Original documents + transcripts"
        "01_EVIDENCE/": "Clustered evidence + forensic analysis"
        "02_EXHIBITS/": "Exhibit constellation index + visuals"
        "03_MOTIONS/": "Generated motions (Week 1-4 + Federal)"
        "04_DISCOVERY/": "Production documents + JEFS docket"
        "05_STRATEGY/": "Legal analysis + damages calculations"
      error_handling: "sync_retry_with_versioning"

    onedrive:
      enabled: true
      sync_type: "batch_on_document_finalization"
      account: "casey.barton92@gmail.com"
      path: "/Case_1FDV-23-0001009"
      priority: "high"
      error_handling: "alert_on_failure"

    github:
      enabled: true
      sync_type: "auto_push_on_completion"
      repos:
        GlacierEQ/AEON-777:
          - path: "motions/"
            content: "Generated motions (auto-push weekly)"
          - path: "exhibits/"
            content: "Exhibit constellation index + charts"
          - path: "forensic-analysis/"
            content: "JEFS timestamp analysis + findings"
      branch_strategy: "feature_branches_auto_pr"
      error_handling: "create_issue_for_manual_push"

# ============================================================================
# PERFORMANCE & EFFICIENCY METRICS
# ============================================================================
metrics:
  target_token_efficiency: 99.4%
  target_latency: "<2min (end-to-end)"
  target_memory_hit_rate: 85%
  target_uptime: 99.9%
  
  monitored_metrics:
    - "files_processed_per_minute"
    - "mind_map_generation_time"
    - "chart_rendering_time"
    - "motion_draft_time"
    - "pdf_compilation_time"
    - "total_pipeline_latency"
    - "backup_sync_success_rate"
    - "memory_system_availability"
    - "consciousness_tier_escalations"

  logging:
    db_table: "orchestrator_execution_log"
    retention: "180_days"
    severity_levels: ["INFO", "WARN", "ERROR", "CRITICAL"]

# ============================================================================
# ERROR HANDLING & RECOVERY
# ============================================================================
error_handling:
  strategy: "fail_safe_with_autonomous_recovery"
  
  error_types:
    file_ingestion_failure:
      action: "retry_exponential_backoff"
      max_retries: 5
      notify: "true"
      fallback: "manual_review_queue"
    
    analysis_timeout:
      action: "skip_to_next_file"
      notify: "true"
      retry: "next_cron_cycle"
    
    output_delivery_failure:
      action: "queue_for_batch_retry"
      notify: "true"
      fallback: "github_push_fallback"
    
    memory_system_unavailable:
      action: "continue_without_memory"
      notify: "critical_alert"
      recovery: "auto_reconnect_on_restore"

  recovery_procedures:
    on_critical_error:
      - "abort_current_operation"
      - "save_state_checkpoint"
      - "send_alert_to_user"
      - "wait_for_manual_recovery"
    
    on_transient_error:
      - "retry_with_exponential_backoff"
      - "log_detailed_error_info"
      - "continue_on_success"

# ============================================================================
# DEPLOYMENT & ACTIVATION
# ============================================================================
deployment:
  environment: "production"
  status: "ready_for_activation"
  
  startup_sequence:
    1: "initialize_state_machine"
    2: "load_memory_systems"
    3: "connect_to_dropbox"
    4: "connect_to_github"
    5: "connect_to_notion"
    6: "connect_to_onedrive"
    7: "activate_triggers"
    8: "log_startup_complete"
  
  auto_start: true
  health_check_interval: "5m"
  graceful_shutdown: "60s"
  
  activation_command: |
    orchestrator.start(
      fileboss_config="configs/FILEBOSS_CONFIG.yaml",
      whisper_config="configs/WHISPER_ULTRAMAX_CONFIG.yaml",
      mode="autonomous",
      token_saver=true
    )